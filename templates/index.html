
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>
        <p>Enter customer details to predict churn</p>

        <form action="/predict" method="POST">

            <label>Tenure (Months)</label>
            <input type="number" name="tenure" min="0" max="100" required>

            <label>Monthly Charges</label>
            <input type="number" name="MonthlyCharges" min="0" step="0.01" required>

            <label>Total Charges</label>
            <input type="number" name="TotalCharges" min="0" step="0.01" required>

            <label>Contract</label>
            <select name="Contract" required>
                <option value="">Select Contract</option>
                <option value="Month-to-month">Month-to-month</option>
                <option value="One year">One year</option>
                <option value="Two year">Two year</option>
            </select>

            <label>Internet Service</label>
            <select name="InternetService" required>
                <option value="">Select Internet Service</option>
                <option value="DSL">DSL</option>
                <option value="Fiber optic">Fiber optic</option>
                <option value="No">No</option>
            </select>

            <label>Payment Method</label>
            <select name="PaymentMethod" required>
                <option value="">Select Payment Method</option>
                <option value="Electronic check">Electronic check</option>
                <option value="Mailed check">Mailed check</option>
                <option value="Bank transfer (automatic)">Bank transfer</option>
                <option value="Credit card (automatic)">Credit card</option>
            </select>

            <button type="submit">Predict Churn</button>

        </form>

        <div class="result {{ prediction_class }}">
            <h3>{{ prediction }}</h3>
            <p>Churn Probability: {{ churn_probability }}%</p>
        </div>

        <div class="result danger">
            <p>{{ error }}</p>
        </div>

    </div>

</body>
</html>
